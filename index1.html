<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidades Inteligentes - Alto de Pinheiros</title>
    <meta name="description" content="Apresentação sobre cidades inteligentes aplicadas ao bairro Alto de Pinheiros em São Paulo">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent position-fixed w-100" style="z-index: 1000;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fas fa-city me-2"></i>Cidades Inteligentes</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#inicio">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#objetivos">Objetivos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#infraestrutura">Infraestrutura</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#conclusao">Conclusão</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5 pt-5" id="inicio">
        <div class="text-center mb-5">
            <h1 class="display-4 mb-3">
                <i class="fas fa-city me-3"></i>
                Cidades Inteligentes
            </h1>
            <p class="lead text-white-50">Alto de Pinheiros - São Paulo</p>
            <div class="loading" id="loading">
                <i class="fas fa-spinner fa-spin me-2"></i>
                Carregando apresentação...
            </div>
        </div>
        
        <!-- Filter buttons -->
        <div class="text-center mb-4" id="filter-buttons" style="display: none;">
            <button class="btn btn-outline-light me-2 mb-2 filter-btn active" data-filter="all">
                <i class="fas fa-th me-1"></i>Todos
            </button>
            <button class="btn btn-outline-light me-2 mb-2 filter-btn" data-filter="objetivos">
                <i class="fas fa-bullseye me-1"></i>Objetivos
            </button>
            <button class="btn btn-outline-light me-2 mb-2 filter-btn" data-filter="infraestrutura">
                <i class="fas fa-building me-1"></i>Infraestrutura
            </button>
            <button class="btn btn-outline-light me-2 mb-2 filter-btn" data-filter="tecnologia">
                <i class="fas fa-microchip me-1"></i>Tecnologia
            </button>
            <button class="btn btn-outline-light me-2 mb-2 filter-btn" data-filter="conclusao">
                <i class="fas fa-check-circle me-1"></i>Conclusão
            </button>
        </div>

        <div id="slides-container" class="d-flex flex-wrap justify-content-around">
            <!-- Slides will be injected here -->
        </div>
    </div>

    <!-- Scroll to top button -->
    <button class="scroll-top" id="scrollTop">
        <i class="fas fa-arrow-up"></i>
    </button>

    <div class="parent">
    <div class="div1"></div>
    
    <div class="div2"></div>
    
    <div class="div3"></div>
    
    <div class="div4"></div>
    
    <div class="div5"></div>
</div>

    <!-- Footer -->
    <footer class="text-center text-white-50 mt-5 py-4">
        <div class="container">
            <p>&copy; 2024 Cidades Inteligentes - Alto de Pinheiros. Apresentação acadêmica.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
